; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; pioarduino fork of espressif32 — tracks current Arduino-ESP32 (v3.x / ESP-IDF v5).
; Check https://github.com/pioarduino/platform-espressif32/releases for the latest tag.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; This board's module uses QUAD (QSPI) PSRAM, not octal — the boot log showed
; "octal_psram: PSRAM chip is not connected" with qio_opi (size=0). qio_qspi
; initialises it. PSRAM holds the full-screen visualiser canvas (320x480x2 =
; 300 KB) so it doesn't starve the ~65 KB of internal RAM.
board_build.arduino.memory_type = qio_qspi
lib_deps =
	diydoohickeys/Preflight@^1.1.0
	lovyan03/LovyanGFX@1.2.28
	lvgl/lvgl@9.5.0
	bblanchon/ArduinoJson@7.4.3
	; led_strip — Espressif's IDF 5 RMT/DMA driver. Vendored under lib/led_strip/
	; (PlatformIO auto-discovers libraries in lib/). Replaces FastLED, whose
	; RMT/SPI backends underrun their FIFOs under WiFi interrupt pressure.
; pioarduino rebuilds the Arduino framework libraries with these on top of its sdkconfig
; (the first build after any change here is a long one):
;  - NVS encryption (HMAC scheme): WiFi password, MQTT password, the device password hash and
;    the HTTPS key are encrypted at rest. The first boot generates a random HMAC key and BURNS
;    it into eFuse key block 5 — one-way, and harmless to USB flashing. Plain NVS left from an
;    older build reads as corrupt: erase the flash once when this lands.
;  - mbedTLS in PSRAM with dynamic buffers: a TLS session would otherwise take ~40 KB of the
;    ~65 KB internal heap.
;  - TLS session tickets: a returning browser resumes its session instead of a full handshake
;    (~0.5 s each on these chips). Preflight's ServerHost turns them on when this is set.
;  - The WebSocket pre-handshake hook, which WsHub signs clients in with.
;  - WiFi TX aggregation (AMPDU) off: with it on, the first segment of a TCP burst is dropped
;    before it reaches the air, and with only 2-4 segments in flight lwIP never gets the three
;    dup-ACKs for a fast retransmit, so every drop waits out the ~1.5-2 s RTO.
;  - PSRAM, restated: the rebuild derives it from the generic devkit board definition, which has
;    none, and silently turns it off (canvas, screen mirror and TLS buffers all live there). These
;    are the prebuilt qio_qspi variant's values.
custom_sdkconfig =
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_QUAD=y
	CONFIG_SPIRAM_TYPE_AUTO=y
	CONFIG_SPIRAM_SPEED_80M=y
	CONFIG_SPIRAM_USE_MALLOC=y
	CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
	CONFIG_NVS_ENCRYPTION=y
	CONFIG_NVS_SEC_KEY_PROTECT_USING_HMAC=y
	CONFIG_NVS_SEC_HMAC_EFUSE_KEY_ID=5
	'# CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC is not set'
	CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
	CONFIG_MBEDTLS_DYNAMIC_BUFFER=y
	CONFIG_ESP_TLS_SERVER_SESSION_TICKETS=y
	CONFIG_HTTPD_WS_PRE_HANDSHAKE_CB_SUPPORT=y
	'# CONFIG_ESP_WIFI_AMPDU_TX_ENABLED is not set'
build_flags =
	-I include
	-fexceptions
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
; Zero-warnings policy applies to OUR code only — scope -Wall/-Wextra to src/ so
; third-party lib_deps (LVGL, LovyanGFX, ArduinoJson, Preflight) don't flood
; the build with warnings we can't fix. (build_flags would apply to libraries too.)
build_src_flags =
	-Wall
	-Wextra
board_build.arduino.partitions = partitions.csv
extra_scripts =
	pre:build_web.py
